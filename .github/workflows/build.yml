name: Build ALL Library Formats

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-all:
    strategy:
      matrix:
        include:
          # === Windows ===
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            dynamic_ext: dll
            static_ext: lib

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            dynamic_ext: dll
            static_ext: lib

          # === Linux ===
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            dynamic_ext: so
            static_ext: a

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            dynamic_ext: so
            static_ext: a

          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            dynamic_ext: so
            static_ext: a

          # === macOS ===
          - os: macos-latest
            target: x86_64-apple-darwin
            dynamic_ext: dylib
            static_ext: a

          - os: macos-latest
            target: aarch64-apple-darwin
            dynamic_ext: dylib
            static_ext: a

          # === FreeBSD ===
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
            dynamic_ext: so
            static_ext: a

          - os: ubuntu-latest
            target: aarch64-unknown-freebsd
            dynamic_ext: so
            static_ext: a

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          # Para alguns targets (FreeBSD, armv7, etc) precisamos do cross
          components: rust-src

      - name: Install cross (quando necessário)
        if: contains(matrix.target, 'freebsd') || contains(matrix.target, 'armv7')
        run: cargo install cross

      - name: Build Dynamic Library (.${{ matrix.dynamic_ext }})
        run: |
          cd interpreter
          if [[ "${{ matrix.target }}" == *freebsd* || "${{ matrix.target }}" == *armv7* ]]; then
            cross rustc --target ${{ matrix.target }} --release -- --crate-type cdylib
          else
            cargo rustc --target ${{ matrix.target }} --release -- --crate-type cdylib
          fi

      - name: Build Static Library (.${{ matrix.static_ext }})
        run: |
          cd interpreter
          if [[ "${{ matrix.target }}" == *freebsd* || "${{ matrix.target }}" == *armv7* ]]; then
            cross rustc --target ${{ matrix.target }} --release -- --crate-type staticlib
          else
            cargo rustc --target ${{ matrix.target }} --release -- --crate-type staticlib
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libs-${{ matrix.target }}
          path: |
            interpreter/target/${{ matrix.target }}/release/*.${{ matrix.dynamic_ext }}
            interpreter/target/${{ matrix.target }}/release/*.${{ matrix.static_ext }}
          retention-days: 7
