name: Build ALL Library Formats
on: [push, workflow_dispatch]

jobs:
  build-all:
    strategy:
      matrix:
        include:
          - os: windows-latest
            dynamic_ext: dll
            static_ext: lib
            target: x86_64-pc-windows-msvc
            rust_flags: ""

          - os: ubuntu-latest
            dynamic_ext: so
            static_ext: a
            target: x86_64-unknown-linux-gnu
            rust_flags: "-C link-args=-Wl,--exclude-libs,ALL"

          - os: macos-latest
            dynamic_ext: dylib
            static_ext: a
            target: x86_64-apple-darwin
            rust_flags: "-C link-args=-Wl,-dead_strip_dylibs"

          - os: macos-latest
            dynamic_ext: dylib
            static_ext: a
            target: aarch64-apple-darwin
            rust_flags: "-C link-args=-Wl,-dead_strip_dylibs"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Build Dynamic Library (.${{ matrix.dynamic_ext }})
        run: |
          cd interpreter
          cargo rustc --target ${{ matrix.target }} --release --crate-type cdylib -- \
            ${{ matrix.rust_flags }} \
            -C panic=abort \
            -C codegen-units=1

      - name: Build Static Library (.${{ matrix.static_ext }})
        run: |
          cd interpreter
          cargo rustc --target ${{ matrix.target }} --release --crate-type staticlib -- \
            ${{ matrix.rust_flags }} \
            -C panic=abort \
            -C codegen-units=1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libs-${{ matrix.os }}-${{ matrix.target }}
          path: |
            interpreter/target/${{ matrix.target }}/release/*.${{ matrix.dynamic_ext }}
            interpreter/target/${{ matrix.target }}/release/*.${{ matrix.static_ext }}
