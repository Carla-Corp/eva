name: Build ALL Library Formats
on: [push, workflow_dispatch]

jobs:
  build-all:
    strategy:
      matrix:
        include:
          - os: windows-latest
            dynamic_ext: dll
            static_ext: lib
            target: x86_64-pc-windows-msvc
            rust_flags: "-C link-args=/Brepro /OPT:REF /OPT:ICF"

          - os: ubuntu-latest
            dynamic_ext: so
            static_ext: a
            target: x86_64-unknown-linux-gnu
            rust_flags: "-C link-args=-Wl,--gc-sections -Wl,--strip-all -Wl,--exclude-libs,ALL"

          - os: macos-latest
            dynamic_ext: dylib
            static_ext: a
            target: x86_64-apple-darwin
            rust_flags: "-C link-args=-Wl,-dead_strip -Wl,-S"

          - os: macos-latest
            dynamic_ext: dylib
            static_ext: a
            target: aarch64-apple-darwin
            rust_flags: "-C link-args=-Wl,-dead_strip -Wl,-S"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          components: rust-src

      - name: Build Dynamic Library (.${{ matrix.dynamic_ext }})
        run: |
          cd interpreter
          cargo rustc --target ${{ matrix.target }} --release \
            --no-default-features \
            -Z build-std=core,alloc \
            -Z build-std-features=panic_immediate_abort \
            -- --crate-type cdylib \
            -C panic=abort \
            -C lto=true \
            -C codegen-units=1 \
            -C opt-level=z \
            ${{ matrix.rust_flags }}

      - name: Build Static Library (.${{ matrix.static_ext }})
        run: |
          cd interpreter
          cargo rustc --target ${{ matrix.target }} --release \
            --no-default-features \
            -Z build-std=core,alloc \
            -Z build-std-features=panic_immediate_abort \
            -- --crate-type staticlib \
            -C panic=abort \
            -C lto=true \
            -C codegen-units=1 \
            -C opt-level=z \
            ${{ matrix.rust_flags }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libs-${{ matrix.os }}-${{ matrix.target }}
          path: |
            interpreter/target/${{ matrix.target }}/release/*.${{ matrix.dynamic_ext }}
            interpreter/target/${{ matrix.target }}/release/*.${{ matrix.static_ext }}
