name: Build ALL Library Formats
on: [push, workflow_dispatch]

jobs:
  build-all:
    strategy:
      matrix:
        include:
          - os: windows-latest
            dynamic_ext: dll
            static_ext: lib
            target: x86_64-pc-windows-msvc
            strip: ""

          - os: ubuntu-latest
            dynamic_ext: so
            static_ext: a
            target: x86_64-unknown-linux-gnu
            strip: "strip -s"

          - os: macos-latest
            dynamic_ext: dylib
            static_ext: a
            target: x86_64-apple-darwin
            strip: "strip -Sx"

          - os: macos-latest
            dynamic_ext: dylib
            static_ext: a
            target: aarch64-apple-darwin
            strip: "strip -Sx"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Build Dynamic Library (.${{ matrix.dynamic_ext }})
        run: |
          cd interpreter
          cargo rustc --target ${{ matrix.target }} --release \
            --no-default-features \
            -- --crate-type cdylib \
            -C panic=abort \
            -C lto=true \
            -C codegen-units=1 \
            -C opt-level=z \
            -C debuginfo=0

      - name: Build Static Library (.${{ matrix.static_ext }})
        run: |
          cd interpreter
          cargo rustc --target ${{ matrix.target }} --release \
            --no-default-features \
            -- --crate-type staticlib \
            -C panic=abort \
            -C lto=true \
            -C codegen-units=1 \
            -C opt-level=z \
            -C debuginfo=0

      - name: Strip symbols (remove lixo)
        if: matrix.strip != ''
        run: |
          cd interpreter/target/${{ matrix.target }}/release
          ${{ matrix.strip }} *.${{ matrix.dynamic_ext }} 2>/dev/null || true
          ${{ matrix.strip }} *.${{ matrix.static_ext }} 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libs-${{ matrix.os }}-${{ matrix.target }}
          path: |
            interpreter/target/${{ matrix.target }}/release/*.${{ matrix.dynamic_ext }}
            interpreter/target/${{ matrix.target }}/release/*.${{ matrix.static_ext }}
