name: Build ALL Library Formats

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-all:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            dynamic_ext: dll
            static_ext: lib
            use_cross: false

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            dynamic_ext: dll
            static_ext: lib
            use_cross: false

          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            dynamic_ext: so
            static_ext: a
            use_cross: false

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            dynamic_ext: so
            static_ext: a
            use_cross: false

          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            dynamic_ext: so
            static_ext: a
            use_cross: true

          # macOS
          - os: macos-latest
            target: x86_64-apple-darwin
            dynamic_ext: dylib
            static_ext: a
            use_cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            dynamic_ext: dylib
            static_ext: a
            use_cross: false

          # FreeBSD
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
            dynamic_ext: so
            static_ext: a
            use_cross: true

          - os: ubuntu-latest
            target: aarch64-unknown-freebsd
            dynamic_ext: so
            static_ext: a
            use_cross: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build Dynamic Library
        run: |
          cd interpreter
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross rustc --target ${{ matrix.target }} --release -- --crate-type cdylib
          else
            cargo rustc --target ${{ matrix.target }} --release -- --crate-type cdylib
          fi
        shell: bash

      - name: Build Static Library
        run: |
          cd interpreter
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross rustc --target ${{ matrix.target }} --release -- --crate-type staticlib
          else
            cargo rustc --target ${{ matrix.target }} --release -- --crate-type staticlib
          fi
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libs-${{ matrix.target }}
          path: |
            interpreter/target/${{ matrix.target }}/release/*.${{ matrix.dynamic_ext }}
            interpreter/target/${{ matrix.target }}/release/*.${{ matrix.static_ext }}
          retention-days: 14
