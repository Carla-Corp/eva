name: Build ALL Library Formats
on: [push, workflow_dispatch]

jobs:
  build-all:
    strategy:
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            arch: x86_64
            ext: lib
            target: x86_64-pc-windows-msvc
            use_llvm: true

          # Windows ARM64
          - os: windows-latest
            arch: arm64
            ext: lib
            target: aarch64-pc-windows-msvc
            use_llvm: true

          # Linux x86_64
          - os: ubuntu-latest
            arch: x86_64
            ext: a
            target: x86_64-unknown-linux-gnu
            use_llvm: false

          # Linux ARM64
          - os: ubuntu-latest
            arch: arm64
            ext: a
            target: aarch64-unknown-linux-gnu
            use_llvm: false

          # macOS x86_64
          - os: macos-latest
            arch: x86_64
            ext: a
            target: x86_64-apple-darwin
            use_llvm: true

          # macOS ARM64
          - os: macos-latest
            arch: arm64
            ext: a
            target: aarch64-apple-darwin
            use_llvm: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      # Só instala cross-compilation tools para Linux ARM
      - name: Install cross-compilation tools (Linux ARM)
        if: contains(matrix.target, 'aarch64-unknown-linux') || contains(matrix.target, 'armv7-unknown-linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # Instala llvm-tools para Windows e macOS
      - name: Install llvm-tools
        if: matrix.use_llvm == true
        run: |
          rustup component add llvm-tools-preview

      # Build da biblioteca
      - name: Build Library
        run: |
          cd interpreter
          cargo build --target ${{ matrix.target }} --release --no-default-features
          ls -la target/${{ matrix.target }}/release/

      # Renomeia símbolo problemático - Linux
      - name: Fix symbol conflicts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd interpreter/target/${{ matrix.target }}/release
          for lib in *.a; do
            if [ -f "$lib" ]; then
              echo "Fixing $lib"
              objcopy --redefine-sym rust_eh_personality=__custom_rust_eh "$lib" "${lib}.tmp"
              mv "${lib}.tmp" "$lib"
              ranlib "$lib"
            fi
          done

      # Renomeia símbolo problemático - Windows
      - name: Fix symbol conflicts (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd interpreter/target/${{ matrix.target }}/release
          for lib in *.lib; do
            if [ -f "$lib" ]; then
              echo "Fixing $lib"
              mkdir -p temp_lib
              cp "$lib" temp_lib/
              cd temp_lib
              llvm-ar x "$lib"
              for obj in *.obj; do
                llvm-objcopy --redefine-sym rust_eh_personality=__custom_rust_eh "$obj"
              done
              llvm-ar rcs "../$lib" *.obj
              cd ..
              rm -rf temp_lib
            fi
          done

      # Renomeia símbolo problemático - macOS
      - name: Fix symbol conflicts (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd interpreter/target/${{ matrix.target }}/release
          for lib in *.a; do
            if [ -f "$lib" ]; then
              echo "Fixing $lib"
              # Usa llvm-objcopy no macOS
              llvm-objcopy --redefine-sym rust_eh_personality=__custom_rust_eh "$lib" "${lib}.tmp"
              mv "${lib}.tmp" "$lib"
              ranlib "$lib"
            fi
          done

      # Upload dos artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libs-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            interpreter/target/${{ matrix.target }}/release/*.${{ matrix.ext }}
            interpreter/target/${{ matrix.target }}/release/*.dll
            interpreter/target/${{ matrix.target }}/release/*.so
            interpreter/target/${{ matrix.target }}/release/*.dylib
